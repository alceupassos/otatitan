# Proxy reverso do canal direto Madre 914 — mesmo app na porta 3040.
#
# O certificado TLS NÃO é o curinga *.giannasiadvogados.com.br: ele não
# cobre este nome. Use o par Origin (ou o que já termina TLS hoje) da zona
# Cloudflare de madre914.com.br, já instalado neste servidor. Não inventamos
# IP nem caminho de certificado — preencha os ssl_certificate* com o par
# que de fato existe no host.
#
# Destino sugerido:
#   /etc/nginx/sites-available/madre914.com.br
#   ln -sf ... /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name madre914.com.br www.madre914.com.br;
    return 301 https://www.madre914.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name madre914.com.br www.madre914.com.br;

    # PREENCHER com o certificado da zona madre914.com.br já presente neste
    # servidor. Não reutilize o par de giannasiadvogados.com.br.
    ssl_certificate     /etc/ssl/cloudflare/madre914.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/madre914.com.br.key;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
