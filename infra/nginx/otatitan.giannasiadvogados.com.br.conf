# Proxy reverso do Otatitan — destino:
# /etc/nginx/sites-available/otatitan.giannasiadvogados.com.br
#
# Segue o mesmo padrão dos outros sites do servidor: nginx no host termina
# TLS com o certificado Cloudflare Origin curinga do domínio e encaminha
# para a aplicação em loopback. O container não é exposto diretamente.

server {
    listen 80;
    listen [::]:80;
    server_name otatitan.giannasiadvogados.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name otatitan.giannasiadvogados.com.br;

    # Curinga *.giannasiadvogados.com.br — o mesmo par já usado pelos
    # demais sites, válido até 2041.
    ssl_certificate /etc/ssl/cloudflare/giannasiadvogados.com.br.pem;
    ssl_certificate_key /etc/ssl/cloudflare/giannasiadvogados.com.br.key;

    # HSTS fica aqui, não na aplicação: só faz sentido onde o TLS termina.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # O upload de mídia (v2) chega a 10 MB — ver MAX_UPLOAD_BYTES.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sem buffer na resposta: o App Router faz streaming de HTML, e
        # bufferizar aqui anularia o ganho de renderização progressiva.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
